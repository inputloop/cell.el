# Byte-compile cell-mode and run its ERT suite on a range of Emacs
# releases, then show the suite can still go red.  Actions are pinned
# to commits, not tags; the tag each commit had when pinned is noted.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs: ['25.3', '26.3', '27.2', '28.2', '29.4', '30.1', 'snapshot']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs }}
      - run: emacs --version | head -1
      - run: make compile
      - run: make test
      - run: make prove-red

